name: Install

# Runs the README one-liner verbatim: live omar.rs script, latest release.
# ci.yml tests the checkout's install.sh, but omar.rs serves its own copy
# (omar-os/omar.rs, public/install.sh). That copy went stale and broke every
# fresh install while CI stayed green. Tests what's deployed, not a commit,
# so not a PR check.

on:
  schedule:
    - cron: '17 */6 * * *'
  # A release built by GITHUB_TOKEN does not fire `release: published`, so
  # follow the workflow that makes it.
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    branches: [main]
    paths: [install.sh, .github/workflows/install.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Catches the drift above directly.
  hosted-script:
    name: omar.rs serves this install.sh
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: install.sh
          sparse-checkout-cone-mode: false
      - name: Compare
        run: |
          curl -fsSL --retry 3 https://omar.rs/install.sh -o "$RUNNER_TEMP/hosted.sh"
          if ! diff -u "$RUNNER_TEMP/hosted.sh" install.sh; then
            echo "::error::https://omar.rs/install.sh differs from install.sh on main; copy it to public/install.sh in omar-os/omar.rs"
            exit 1
          fi

  one-liner:
    name: One-liner (${{ matrix.os }})
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    steps:
      # Smoke program only; the install uses nothing from the checkout.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tests/ci/direct_run.omar
          sparse-checkout-cone-mode: false

      # Default install dir, so the sudo path runs as for a user. Retry: the
      # script's unauthenticated releases API call is rate limited per runner IP.
      - name: curl -fsSL https://omar.rs/install.sh | sh
        run: |
          for attempt in 1 2 3; do
            curl -fsSL https://omar.rs/install.sh | sh && exit 0
            echo "::warning::attempt $attempt failed"
            sleep 30
          done
          exit 1

      - name: Installed the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)
          version=$(omar --version)
          echo "$version (latest $latest)"
          [ "$version" = "omar ${latest#v}" ]
          command -v omarc

      # Outside any source tree, so only the installed omarc can be found.
      - name: Runs a program
        run: |
          cd "$RUNNER_TEMP"
          output=$(omar run "$GITHUB_WORKSPACE/tests/ci/direct_run.omar" \
            --input run.request=hello --replace --fg)
          echo "$output"
          grep -Fq 'Output run.result = "hello"' <<<"$output"

  # Closer to a fresh server than a runner: dash as sh, root, no sudo.
  one-liner-minimal:
    name: One-liner (debian:stable-slim)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: debian:stable-slim
    steps:
      # git: `omar run` needs it for team workspaces; installer doesn't say so.
      - name: Prerequisites
        run: apt-get update -qq && apt-get install -y -qq curl ca-certificates git >/dev/null
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tests/ci/direct_run.omar
          sparse-checkout-cone-mode: false
      - name: curl -fsSL https://omar.rs/install.sh | sh
        shell: sh -e {0}
        run: |
          for attempt in 1 2 3; do
            curl -fsSL https://omar.rs/install.sh | sh && exit 0
            echo "::warning::attempt $attempt failed"
            sleep 30
          done
          exit 1
      - name: Runs a program
        run: |
          omar --version
          cd /tmp
          output=$(omar run "$GITHUB_WORKSPACE/tests/ci/direct_run.omar" \
            --input run.request=hello --replace --fg)
          echo "$output"
          grep -Fq 'Output run.result = "hello"' <<<"$output"
