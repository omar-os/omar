name: Claude Code Latest Contract

# Omar-backed ultracode relies on Claude Code's Workflow tool, inline --agents
# MCP servers, StructuredOutput, PreToolUse hooks and
# CLAUDE_CODE_SKIP_PROMPT_HISTORY. ci.yml checks the pinned version on every
# PR; this runs the same credential-free mock-provider test against the newest
# release each night, so a breaking Claude Code update fails here without
# waiting for a PR. No secrets: the model is a loopback mock.

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  claude-workflow-contract:
    name: Claude Workflow Contract (latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install latest Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build OMAR
        run: cargo build --bin omar
      - name: Verify the Workflow contract against the mock provider
        run: |
          claude --version
          python3 tests/ci/claude_workflow_contract.py
