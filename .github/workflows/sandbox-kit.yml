name: Sandbox Kit

# Publishes sandbox/omar-sandbox to docker.io/omar-os/omar-sandbox (sbx only
# trusts docker.io/ kits by default). Runs pin it by digest: copy the digest
# this prints into sandbox::DEFAULT_TEMPLATE. Pushes come only from this
# repository's branches; secrets DOCKERHUB_USERNAME/DOCKERHUB_TOKEN.
on:
  push:
    paths: ["sandbox/omar-sandbox/**", ".github/workflows/sandbox-kit.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish kit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push (amd64, arm64)
        run: |
          image=docker.io/omar-os/omar-sandbox
          tags="-t $image:sha-${GITHUB_SHA::12}"
          [ "$GITHUB_REF" = refs/heads/main ] && tags="$tags -t $image:latest"
          docker buildx build --platform linux/amd64,linux/arm64 --push $tags \
            --metadata-file "$RUNNER_TEMP/metadata.json" \
            -f sandbox/omar-sandbox/omar-sandbox.yaml sandbox/omar-sandbox
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")
          echo "Kit: \`$image@$digest\`" | tee -a "$GITHUB_STEP_SUMMARY"
