[workspace]
members = ["."]
default-members = ["."]

[workspace.package]
rust-version = "1.89"

[package]
name = "omar"
version = "0.4.3"
edition = "2021"
rust-version.workspace = true
description = "Agent dashboard for tmux"
license = "MIT"
default-run = "omar"

[dependencies]
cap-std = "3"
libc = "0.2"
shlex = "2.0.1"
sha2 = "0.10"
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
ansi-to-tui = "7"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tracing = "0.1.44"
# Terminal attach. `tungstenite` is the sync API, which matches the blocking
# thread-per-connection model `omar serve` already uses. Terminal connections
# remain loopback/plaintext; the Slack client below enables TLS for external WSS.
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
portable-pty = "0.8"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

rpassword = "7"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

# Embeds the Mission Control bundle from `web/dist/spa` so `omar serve --ui`
# can hand it out. Off by default: a plain `cargo build` needs no Node. Build
# the bundle first with `npm run build:spa` in `web/`.
[features]
ui = []

[[bin]]
name = "omar"
path = "src/omar.rs"

# Fingerprinting pinned development binaries should not dominate session startup.
[profile.dev.package.sha2]
opt-level = 3
